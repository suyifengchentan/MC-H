suite_name: freek_validation
description: >
  Validation suite for the free-K spectral methodology. These runs check whether
  spectral cluster-count discovery, stabilized spectral prototypes, and spectral
  anchor regularization stay stable across coarse, medium, and fine granularity.

defaults:
  seeds: [42]
  output_root: save/experiments
  eval_split: both
  train_overrides:
    reload: false
    clustering_mode: "spectral_free_k"

cases:
  - id: freek_coarse_stl10
    hypothesis: >
      On coarse-grained STL10, the discovered cluster count should remain small
      and stable while preserving strong macro-semantic clustering quality.
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    tags: [freek, validation, coarse]

  - id: freek_medium_image200
    hypothesis: >
      On Image200, the spectral estimator should discover a larger effective
      cluster count than coarse data while maintaining stable training dynamics.
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    tags: [freek, validation, medium]

  - id: freek_fine_cub
    hypothesis: >
      On fine-grained CUB, free-K spectral prototypes should improve separation
      pressure and expose a higher effective cluster complexity than coarse data.
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    tags: [freek, validation, fine]
