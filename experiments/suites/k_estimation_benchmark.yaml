suite_name: k_estimation_benchmark
description: >
  Benchmark suite for validating automatic cluster-count discovery across
  multiple granularity regimes. Collects estimated K statistics and K error.

defaults:
  seeds: [42, 43, 44]
  output_root: save/experiments
  eval_split: both
  train_overrides:
    reload: false
    clustering_mode: "spectral_free_k"
    diversity_weight_mode: "adaptive"
    subspace_anchor_mode: "auto"

cases:
  - id: coarse_stl10_freek
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    tags: [k_estimation, coarse]
  - id: coarse_cifar100_freek
    granularity: coarse
    base_train_config: config/train/coarse_grained/cifar100_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/cifar100_vitb16_hypersphere_dpp_config.yaml
    tags: [k_estimation, coarse]
  - id: medium_image100_freek
    granularity: medium
    base_train_config: config/train/medium_grained/image100_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image100_vitb16_hypersphere_dpp_config.yaml
    tags: [k_estimation, medium]
  - id: medium_image200_freek
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    tags: [k_estimation, medium]
  - id: fine_cub_freek
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    tags: [k_estimation, fine]
  - id: fine_oxford_pet_freek
    granularity: fine
    base_train_config: config/train/fine_grained/oxford_pet_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/oxford_pet_vitb16_hypersphere_dpp_config.yaml
    tags: [k_estimation, fine]
