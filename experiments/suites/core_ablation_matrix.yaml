suite_name: core_ablation_matrix
description: >
  Cross-granularity core ablation matrix aligned with the paper's modular claims.
  Covers the minimum reviewer-facing ablations on one coarse, one medium, and
  one fine-grained dataset.

defaults:
  seeds: [42, 43, 44]
  output_root: save/experiments
  eval_split: both
  train_overrides:
    reload: false
    clustering_mode: "spectral_free_k"
    diversity_weight_mode: "adaptive"
    subspace_anchor_mode: "auto"

cases:
  - id: coarse_stl10_full
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    tags: [ablation, coarse, full]
  - id: coarse_stl10_no_dpp
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.0
    tags: [ablation, coarse, no_dpp]
  - id: coarse_stl10_no_density_weighting
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      diversity_weight_mode: "constant"
    tags: [ablation, coarse, no_density_weighting]
  - id: coarse_stl10_fixed_k
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "fixed_k"
      semantic_prototype_enabled: false
      lambda_semantic: 0.0
    tags: [ablation, coarse, fixed_k]
  - id: coarse_stl10_no_stabilization
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      spectral_proto_momentum: 0.0
    tags: [ablation, coarse, no_stabilization]
  - id: coarse_stl10_no_subspace
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      lambda_subspace: 0.0
    tags: [ablation, coarse, no_subspace]
  - id: coarse_stl10_pca_anchor
    granularity: coarse
    base_train_config: config/train/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/stl10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      subspace_anchor_mode: "teacher_pca"
    tags: [ablation, coarse, pca_anchor]

  - id: medium_image200_full
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    tags: [ablation, medium, full]
  - id: medium_image200_no_dpp
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.0
    tags: [ablation, medium, no_dpp]
  - id: medium_image200_no_density_weighting
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      diversity_weight_mode: "constant"
    tags: [ablation, medium, no_density_weighting]
  - id: medium_image200_fixed_k
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "fixed_k"
      semantic_prototype_enabled: false
      lambda_semantic: 0.0
    tags: [ablation, medium, fixed_k]
  - id: medium_image200_no_stabilization
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      spectral_proto_momentum: 0.0
    tags: [ablation, medium, no_stabilization]
  - id: medium_image200_no_subspace
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      lambda_subspace: 0.0
    tags: [ablation, medium, no_subspace]
  - id: medium_image200_pca_anchor
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      subspace_anchor_mode: "teacher_pca"
    tags: [ablation, medium, pca_anchor]

  - id: fine_cub_full
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    tags: [ablation, fine, full]
  - id: fine_cub_no_dpp
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.0
    tags: [ablation, fine, no_dpp]
  - id: fine_cub_no_density_weighting
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      diversity_weight_mode: "constant"
    tags: [ablation, fine, no_density_weighting]
  - id: fine_cub_fixed_k
