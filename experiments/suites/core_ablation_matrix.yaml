    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "fixed_k"
      semantic_prototype_enabled: false
      lambda_semantic: 0.0
    tags: [ablation, fine, fixed_k]
  - id: fine_cub_no_stabilization
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      spectral_proto_momentum: 0.0
    tags: [ablation, fine, no_stabilization]
  - id: fine_cub_no_subspace
