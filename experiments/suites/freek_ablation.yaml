suite_name: freek_ablation
description: >
  Ablation suite for the free-K spectral methodology. These cases isolate the
  effect of spectral cluster discovery and prototype stabilization.

defaults:
  seeds: [42]
  output_root: save/experiments
  eval_split: both
  train_overrides:
    reload: false

cases:
  - id: cub_fixed_k_baseline
    hypothesis: >
      Fixed-K prototype learning provides the branch-local baseline before
      turning on spectral free-K discovery.
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "fixed_k"
      semantic_prototype_enabled: false
      lambda_semantic: 0.0
    tags: [freek, ablation, baseline, fixed_k]

  - id: cub_freek_full
    hypothesis: >
      The full free-K setup should outperform or match the fixed-K baseline on
      CUB while exposing a non-trivial discovered cluster count.
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "spectral_free_k"
    tags: [freek, ablation, full]

  - id: cub_freek_no_stabilization
    hypothesis: >
      Removing EMA-based spectral prototype stabilization should increase
      prototype drift and reduce validation quality.
    granularity: fine
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "spectral_free_k"
      spectral_proto_momentum: 0.0
    tags: [freek, ablation, no_stabilization]

  - id: image200_freek_no_semantic
    hypothesis: >
      Free-K spectral discovery should remain viable on Image200 even after
      removing semantic text guidance, isolating the effect of spectral clustering.
    granularity: medium
    base_train_config: config/train/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image200_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      clustering_mode: "spectral_free_k"
      semantic_prototype_enabled: false
      lambda_semantic: 0.0
    tags: [freek, ablation, no_semantic]
