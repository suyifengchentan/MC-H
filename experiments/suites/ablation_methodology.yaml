suite_name: methodology_ablation
description: >
  Ablation experiments mapped to methodology.md. Focus on the role of DPP,
  adaptive weighting, loss-term balance, and DPP scheduling.

defaults:
  seeds: [42, 43, 44]
  output_root: save/experiments
  eval_split: both
  train_overrides:
    reload: false
    epochs: 15

cases:
  - id: cub_full
    hypothesis: "Reference baseline for all CUB ablations."
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    tags: [ablation, cub, baseline]

  - id: cub_no_dpp
    hypothesis: >
      Section 3.3/3.5: removing DPP should reduce global subspace expansion and
      hurt fine-grained clustering quality.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.0
    tags: [ablation, cub, dpp]

  - id: cub_no_subspace
    hypothesis: >
      Section 3.6: removing L_sub should weaken covariance alignment and
      increase noisy variance leakage.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      lambda_subspace: 0.0
    tags: [ablation, cub, subspace]

  - id: cub_no_cluster
    hypothesis: >
      Section 3.6: removing L_cluster should degrade cluster-level attraction
      and assignment consistency.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      lambda_cluster: 0.0
    tags: [ablation, cub, cluster]

  - id: cub_no_instance
    hypothesis: >
      Section 3.6: removing L_inst should impair local discrimination and
      destabilize prototype learning.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      lambda_instance: 0.0
    tags: [ablation, cub, instance]

  - id: cub_warmup_0
    hypothesis: >
      Section 3.4/3.7: removing curriculum warmup may apply repulsion too early
      and hurt optimization stability.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      dpp_warmup_epochs: 0
    tags: [ablation, cub, warmup]

  - id: cub_warmup_60
    hypothesis: >
      Section 3.7: excessive warmup delays diversity shaping and may underuse DPP
      in the useful mid-training window.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      dpp_warmup_epochs: 60
    tags: [ablation, cub, warmup]

  - id: cub_dpp_freq_1
    hypothesis: >
      Section 3.7: too frequent DPP updates may increase optimization tension
      between attraction and repulsion.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      dpp_every_n_steps: 1
    tags: [ablation, cub, dpp_frequency]

  - id: cub_dpp_freq_8
    hypothesis: >
      Section 3.7: too sparse DPP updates may weaken global expansion and reduce
      final diversity.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      dpp_every_n_steps: 8
    tags: [ablation, cub, dpp_frequency]

  - id: cub_alpha_low
    hypothesis: >
      Section 3.4: weak alpha_div_base may under-amplify density-aware repulsion.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.2
    tags: [ablation, cub, alpha]

  - id: cub_alpha_high
    hypothesis: >
      Section 3.4: overly strong alpha_div_base may over-emphasize repulsion and
      disturb cluster compactness.
    base_train_config: config/train/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/fine_grained/cub_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.9
    tags: [ablation, cub, alpha]

  - id: cifar10_full
    hypothesis: "Reference baseline for coarse-grained DPP benefit comparison."
    base_train_config: config/train/coarse_grained/cifar10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/cifar10_vitb16_hypersphere_dpp_config.yaml
    tags: [ablation, cifar10, baseline]

  - id: cifar10_no_dpp
    hypothesis: >
      Section 3.3.3: coarse-grained data should show a smaller performance drop
      after removing DPP compared with fine-grained CUB.
    base_train_config: config/train/coarse_grained/cifar10_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/coarse_grained/cifar10_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.0
    tags: [ablation, cifar10, dpp]

  - id: image100_full
    hypothesis: "Reference baseline for medium-grained DPP benefit comparison."
    base_train_config: config/train/medium_grained/image100_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image100_vitb16_hypersphere_dpp_config.yaml
    tags: [ablation, image100, baseline]

  - id: image100_no_dpp
    hypothesis: >
      Section 3.3.3: medium-grained drop after removing DPP should fall between
      coarse CIFAR10 and fine-grained CUB.
    base_train_config: config/train/medium_grained/image100_vitb16_hypersphere_dpp_config.yaml
    base_eval_config: config/test/medium_grained/image100_vitb16_hypersphere_dpp_config.yaml
    train_overrides:
      alpha_div_base: 0.0
    tags: [ablation, image100, dpp]
