# Image200 ViT-L/14 hypersphere-DPP prototype evaluation config

# Data
dataset: "Image200"
dataset_dir: "/home/geyingjie/gmm-data/tiny-imagenet-200"
# 标准 Tiny-ImageNet: train/<wnid>/images, val/images + val_annotations.txt, test/images(无标签)
class_num: 200
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
adapter_hidden_dim: 1024
adapter_dropout: 0.1

# Evaluation / runtime
eval_batch_size: 512
workers: 8
seed: 42
