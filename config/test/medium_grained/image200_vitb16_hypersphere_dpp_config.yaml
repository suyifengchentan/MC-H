# Image200 ViT-B/16 hypersphere-DPP prototype evaluation config

# Data
dataset: "Image200"
dataset_dir: "/home/geyingjie/hypersphere-data/Image200"
# 新逻辑统一使用 WebDataset tar shard:
# data/train-*.tar, data/train-*.index.npz, data/validation-*.tar, data/validation-*.index.npz, label_info.json
class_num: 200
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "/home/geyingjie/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.12
transform_profile: "imagenet200_two_view"
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.15
semantic_temperature: 0.2

# Evaluation / runtime
eval_batch_size: 128
workers: 2
seed: 42
