# TinyImageNet200 ViT-B/16 hypersphere-DPP prototype evaluation config

# Data
dataset: "TinyImageNet200"
dataset_dir: "/opt/hypersphere-data/tiny-imagenet-200"
class_num: 200
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "~/clip-pretrained/open_clip_pytorch_model.bin"
# Two-block residual adapter: each block uses hidden_dim / 2.
adapter_hidden_dim: 1536
adapter_dropout: 0.12
transform_profile: "tiny_imagenet200_two_view"
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.12
semantic_temperature: 0.2

# Evaluation / runtime
eval_batch_size: 128
workers: 4
seed: 42
