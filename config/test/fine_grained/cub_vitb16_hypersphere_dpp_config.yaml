# CUB ViT-L/14 hypersphere-DPP prototype evaluation config

# Data
dataset: "CUB_200_2011"
dataset_dir: "~/hypersphere-data/CUB_200_2011/CUB_200_2011"
class_num: 200
validation_ratio: 0.1
validation_seed: 42

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
adapter_hidden_dim: 1024
adapter_dropout: 0.1
transform_profile: "fine_grained_two_view"
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.12
semantic_temperature: 0.2

# Evaluation / runtime
eval_batch_size: 128
workers: 8
seed: 42
