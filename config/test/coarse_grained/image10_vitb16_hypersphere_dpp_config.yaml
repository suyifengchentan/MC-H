# Image10 ViT-L/14 hypersphere-DPP prototype evaluation config

# Data
dataset: "Image10"
dataset_dir: "/home/geyingjie/hypersphere-data/imagenet-10"
# ImageNet HDF5 shard layout:
# data/train-*.h5, data/test-*.h5, label_info.json
class_num: 10
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "test"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
adapter_hidden_dim: 1024
adapter_dropout: 0.1
transform_profile: "imagenet10_two_view"
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.1
semantic_temperature: 0.2

# Evaluation / runtime
eval_batch_size: 128
workers: 8
seed: 42
