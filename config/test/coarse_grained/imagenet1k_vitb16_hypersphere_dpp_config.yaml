# ImageNet1K ViT-B/16 hypersphere-DPP prototype evaluation config

# Data
dataset: "ImageNet1K"
dataset_dir: "~/hypersphere-data/ImageNet1K"
class_num: 1000
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"
# ImageNet HDF5 shard layout:
# data/train-*.h5, data/validation-*.h5, label_info.json

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "~/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.1
transform_profile: "imagenet1k_two_view"
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.1
semantic_temperature: 0.2

# Evaluation / runtime
eval_batch_size: 256
workers: 4
seed: 42
