# CIFAR100 ViT-B/16 hypersphere-DPP prototype evaluation config

# Data
dataset: "CIFAR100"
dataset_dir: "/home/geyingjie/hypersphere-data/CIFAR100"
cifar100_label_mode: "coarse"
class_num: 20
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "test"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "/home/geyingjie/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.1
transform_profile: "small_image_two_view"
semantic_prototype_enabled: true
semantic_prompt_style: "clip_ensemble"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.05
semantic_temperature: 0.2
semantic_target_topk: 1

# Evaluation / runtime
eval_batch_size: 256
workers: 8
seed: 42
