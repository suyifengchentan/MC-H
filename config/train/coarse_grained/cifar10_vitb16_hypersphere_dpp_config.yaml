# CIFAR10 ViT-B/16 hypersphere-DPP prototype training config

# Data
dataset: "CIFAR10"
dataset_dir: "~/hypersphere-data/CIFAR10"
class_num: 10
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "test"
cached_teacher_views_enabled: true
cached_teacher_num_views: 8
cached_teacher_dtype: "float16"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "~/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.1
transform_profile: "small_image_two_view"

# Optimization
precision: "fp16"
batch_size: 192
eval_batch_size: 256
epochs: 300
learning_rate: 0.0003
weight_decay: 0.00001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.25
lambda_instance: 1.0
lambda_cluster: 1.0
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.1
semantic_temperature: 0.2

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.1
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 8.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 2
subspace_topk_clusters: 16

# DPP
alpha_div_base: 0.3
dpp_warmup_epochs: 15
dpp_every_n_steps: 4
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 3
model_path: "results/hypersphere_dpp/CIFAR10_CLIP_ViTB16_HypersphereDPP"
workers: 8
reload: false
seed: 42
best_checkpoint_patience: 15
