# ImageNet1K ViT-B/16 hypersphere-DPP config for the freek branch

# Data
dataset: "ImageNet1K"
dataset_dir: "/home/geyingjie/hypersphere-data/ImageNet1K"
class_num: 1000
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"
# HDF5 shard layout:
# data/train-*.h5, data/validation-*.h5, label_info.json

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
adapter_hidden_dim: 1024
adapter_dropout: 0.1
transform_profile: "imagenet1k_two_view"
clustering_mode: "spectral_free_k"
min_spectral_clusters: 128
max_spectral_clusters: 1000
initial_spectral_clusters: 1200
spectral_assignment_temperature: 0.2
spectral_sharpen_temperature: 0.1
spectral_proto_momentum: 0.9

# Optimization
precision: "fp16"
batch_size: 256
eval_batch_size: 512
epochs: 100
learning_rate: 0.0002
weight_decay: 0.000001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.25
lambda_instance: 1.0
lambda_cluster: 0.7
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.15
lambda_semantic_retrieval: 0.08
semantic_temperature: 0.2
semantic_retrieval_topk: 8

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.12
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 8.0
subspace_every_n_steps: 2

# DPP
alpha_div_base: 0.35
dpp_warmup_epochs: 15
dpp_every_n_steps: 4
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 1
model_path: "results/hypersphere_dpp/ImageNet1K_CLIP_ViTB16_HypersphereDPP"
workers: 8
reload: false
seed: 42
best_checkpoint_patience: 10
