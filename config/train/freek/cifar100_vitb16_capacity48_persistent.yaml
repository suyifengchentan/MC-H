# CIFAR-100 mixed protocol: persistent prototype capacity sweep (K=48).
dataset: "CIFAR100"
dataset_dir: "/home/geyingjie/hypersphere-data/CIFAR100"
class_num: 48
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "test"

image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "/home/geyingjie/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.1
transform_profile: "small_image_two_view"
clustering_mode: "fixed_k"

precision: "fp16"
batch_size: 256
eval_batch_size: 512
epochs: 30
learning_rate: 0.00025
weight_decay: 0.00001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

instance_temperature: 0.2
cluster_temperature: 0.3
lambda_instance: 1.0
lambda_cluster: 1.0
sinkhorn_iters: 3
sinkhorn_epsilon: 0.05
semantic_prototype_enabled: false
lambda_subspace: 0.12
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 8.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 2
subspace_topk_clusters: 32
alpha_div_base: 0.3
dpp_warmup_epochs: 20
dpp_every_n_steps: 4
dpp_jitter: 0.00001

eval_interval: 30
model_path: "results/freek/cifar100_mixed_capacity_sweep/k48_seed_42"
workers: 4
distributed_batch_size_mode: "global"
reload: false
seed: 42
best_checkpoint_patience: 0
cached_teacher_views_enabled: true
cached_teacher_num_views: 8
cached_teacher_dtype: "float16"
