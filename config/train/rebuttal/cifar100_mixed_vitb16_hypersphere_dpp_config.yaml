# CIFAR-100-Mixed controlled experiment: 10 coarse superclasses + 50 fine subclasses.
dataset: "CIFAR100"
dataset_dir: "~/hypersphere-data/CIFAR100"
class_num: 60
cifar100_label_mode: "fine"
cifar100_allow_noncanonical_class_num: true
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "test"

image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "~/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.1
transform_profile: "small_image_two_view"

precision: "fp16"
batch_size: 192
eval_batch_size: 256
epochs: 350
learning_rate: 0.00025
weight_decay: 0.00001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

instance_temperature: 0.2
cluster_temperature: 0.3
lambda_instance: 1.0
lambda_cluster: 1.0
sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# No category names, text prompts, or label-derived semantic anchors in this controlled experiment.
semantic_prototype_enabled: false
lambda_semantic: 0.0
lambda_semantic_retrieval: 0.0
lambda_prototype_anchor: 0.0

lambda_subspace: 0.12
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 8.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 2
subspace_topk_clusters: 32

alpha_div_base: 0.3
dpp_warmup_epochs: 20
dpp_every_n_steps: 4
dpp_jitter: 0.00001

# Use the final epoch for the primary rebuttal report; do not select by label-based validation metrics.
eval_interval: 350
model_path: "save/experiments/cifar100_mixed/adaptive/seed_42"
workers: 8
reload: false
seed: 42
best_checkpoint_patience: 0
