# Image50 ViT-L/14 hypersphere-DPP prototype training config

# Data
dataset: "Image50"
dataset_dir: "/home/geyingjie/gmm-data/imagenet-50-subset"
class_num: 50
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 768
backbone_name: "ViT-L-14"
pretrained: "laion2b_s32b_b82k"
adapter_hidden_dim: 1024
adapter_dropout: 0.1
transform_profile: "imagenet50_two_view"

# Optimization
precision: "fp16"
batch_size: 512
eval_batch_size: 512
epochs: 400
learning_rate: 0.00025
weight_decay: 0.000001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.25
lambda_instance: 1.0
lambda_cluster: 1.0

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.15
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 2.0

# DPP
alpha_div_base: 0.4
dpp_warmup_epochs: 20
dpp_every_n_steps: 2
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 3
model_path: "save/hypersphere_dpp/Image50_CLIP_ViTL14_HypersphereDPP"
workers: 8
reload: false
seed: 42
best_checkpoint_patience: 80
