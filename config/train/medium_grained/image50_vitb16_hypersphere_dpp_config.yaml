# Image50 ViT-L/14 hypersphere-DPP prototype training config

# Data
dataset: "Image50"
dataset_dir: "~/hypersphere-data/Image50"
# 统一使用 ImageNet HDF5 shard:
# data/train-*.h5, data/validation-*.h5, label_info.json
class_num: 50
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "~/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.15
transform_profile: "imagenet50_two_view"

# Optimization
precision: "fp16"
batch_size: 192
eval_batch_size: 512
epochs: 400
learning_rate: 0.00018
weight_decay: 0.00001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.3
lambda_instance: 1.0
lambda_cluster: 1.0
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.15
semantic_temperature: 0.2

sinkhorn_iters: 3
sinkhorn_epsilon: 0.07

# Subspace
lambda_subspace: 0.1
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 6.0
subspace_every_n_steps: 3
subspace_pca_q_offset: 2
subspace_topk_clusters: 24

# DPP
alpha_div_base: 0.6
alpha_div_mode: "sigmoid_floor"
alpha_div_floor: 0.08
alpha_div_rho_center: 0.005
alpha_div_rho_scale: 0.01
alpha_div_max: 0.45
dpp_warmup_epochs: 30
dpp_every_n_steps: 6
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 3
model_path: "save/hypersphere_dpp/Image50_CLIP_ViTB16_HypersphereDPP"
workers: 4
reload: false
seed: 42
best_checkpoint_patience: 15
