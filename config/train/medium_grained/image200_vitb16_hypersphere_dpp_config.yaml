# Image200 ViT-B/16 hypersphere-DPP prototype training config

# Data
dataset: "Image200"
dataset_dir: "/home/geyingjie/hypersphere-data/Image200"
# 统一使用 ImageNet HDF5 shard:
# data/train-*.h5, data/validation-*.h5, label_info.json
class_num: 200
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "/home/geyingjie/clip-pretrained/open_clip_pytorch_model.bin"
# Two-block residual adapter: each block uses hidden_dim / 2.
adapter_hidden_dim: 1536
adapter_dropout: 0.12
transform_profile: "imagenet200_two_view"

# Optimization
precision: "bf16"
batch_size: 512
eval_batch_size: 512
epochs: 240
learning_rate: 0.00025
weight_decay: 0.00001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.3
lambda_instance: 1.0
lambda_cluster: 1.0
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
semantic_template_topk: 16
lambda_semantic: 0.15
semantic_temperature: 0.2

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.15
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 5.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 2
subspace_topk_clusters: 64

# DPP
alpha_div_base: 0.4
alpha_div_mode: "sigmoid_floor"
alpha_div_floor: 0.1
alpha_div_rho_center: 0.005
alpha_div_rho_scale: 0.01
alpha_div_max: 0.32
dpp_warmup_epochs: 18
dpp_every_n_steps: 4
dpp_jitter: 0.00001
class_aware_dpp: true
class_aware_dpp_min_mass: 2.0

# Runtime / output
eval_interval: 3
model_path: "save/hypersphere_dpp/Image200_CLIP_ViTB16_HypersphereDPP"
workers: 2
reload: false
seed: 42
best_checkpoint_patience: 15
