# config/train/medium_grained/image200_clip_compactness_config.yaml

# ------------------- 教师模型参数 -------------------
precision: "bf16"
eval_interval: 3
eval_batch_size: 512

# ------------------- 数据集参数 -------------------
dataset: "Image200"
dataset_dir: "/home/geyingjie/gmm-data/tiny-imagenet-200"
class_num: 200
validation_ratio: 0.1
validation_seed: 42

# ------------------ 学生模型与训练参数 ------------------
image_size: 224
feature_dim: 768
feature_adapter_enabled: true
feature_adapter_hidden_dim: 1024
feature_adapter_dropout: 0.1
batch_size: 512
epochs: 800
start_epoch: 0

# --- 优化器与损失函数参数 ---
learning_rate: 0.0003
weight_decay: 0.000001
instance_temperature: 0.25
cluster_temperature: 0.5
lambda_instance: 0.08
alpha_align_c: 0.8
beta_align_z: 1.2
gamma_compactness: 0.4
gamma_space: 0.2

# -------------------- 系统与路径参数 -----------------
model_path: "save/frozen_feature/Image200_CLIP_ViTB16_FrozenFeature_DPPCovariance_Retuned_G=0.4"
workers: 8
reload: False
save_best_only: true
seed: 42
best_checkpoint_patience: 150

# -------------------- experimental parameters --------------------
# Tiny-ImageNet 对裁剪和视图差异更敏感，使用专门的温和增强。
transform_profile: "tiny_imagenet_coarse"
dpp_every_n_steps: 2
class_aware_dpp: false
class_aware_dpp_mask_floor: 0.1
compactness_use_cluster_base: true
compactness_use_soft_assignment: true
compactness_use_cosine: true
compactness_warmup_epochs: 20
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
subspace_loss: "covariance"
subspace_compare_log: False
subspace_compare_target: "lowrank"
distill_confidence_weighting: true
distill_confidence_metric: "entropy"
distill_confidence_temperature: 6.0
distill_confidence_floor: 0.1
