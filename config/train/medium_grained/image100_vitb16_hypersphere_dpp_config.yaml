# Image100 ViT-L/14 hypersphere-DPP prototype training config

# Data
dataset: "Image100"
dataset_dir: "~/hypersphere-data/Image100"
# 统一使用 ImageNet HDF5 shard:
# data/train-*.h5, data/validation-*.h5, label_info.json
class_num: 100
validation_ratio: 0.1
validation_seed: 42
official_eval_split: "val"

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
pretrained_checkpoint: "~/clip-pretrained/open_clip_pytorch_model.bin"
adapter_hidden_dim: 768
adapter_dropout: 0.1
transform_profile: "imagenet100_two_view"

# Optimization
precision: "fp16"
batch_size: 256
eval_batch_size: 512
epochs: 450
learning_rate: 0.00025
weight_decay: 0.000001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.3
lambda_instance: 1.0
lambda_cluster: 1.0
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.15
semantic_temperature: 0.2

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.15
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 6.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 2
subspace_topk_clusters: 48

# DPP
alpha_div_base: 0.35
alpha_div_mode: "sigmoid_floor"
alpha_div_floor: 0.08
alpha_div_rho_center: 0.005
alpha_div_rho_scale: 0.01
alpha_div_max: 0.3
dpp_warmup_epochs: 20
dpp_every_n_steps: 4
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 3
model_path: "save/hypersphere_dpp/Image100_CLIP_ViTB16_HypersphereDPP_20260328_200155"
workers: 2
reload: true
seed: 42
best_checkpoint_patience: 15
