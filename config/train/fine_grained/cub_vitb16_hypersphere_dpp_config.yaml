# CUB ViT-L/14 hypersphere-DPP prototype training config

# Data
dataset: "CUB_200_2011"
dataset_dir: "/home/geyingjie/hypersphere-data/CUB_200_2011/CUB_200_2011"
class_num: 200
validation_ratio: 0.1
validation_seed: 42

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
adapter_hidden_dim: 1024
adapter_dropout: 0.1
transform_profile: "fine_grained_two_view"

# Optimization
precision: "fp16"
batch_size: 128
eval_batch_size: 256
epochs: 200
learning_rate: 0.0003
weight_decay: 0.000001
lr_scheduler: "cosine"
min_learning_rate: 0.00001

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.4
lambda_instance: 1.0
lambda_cluster: 1.0

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.2
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 3.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 4
subspace_topk_clusters: 48

# DPP
alpha_div_base: 0.5
dpp_warmup_epochs: 15
dpp_every_n_steps: 4
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 1
model_path: "save/hypersphere_dpp/CUB_200_2011_CLIP_ViTL14_HypersphereDPP"
workers: 8
reload: false
seed: 42
best_checkpoint_patience: 10
