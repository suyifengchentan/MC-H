# CUB ViT-B/16 hypersphere-DPP prototype training config

# Data
dataset: "CUB_200_2011"
dataset_dir: "/home/geyingjie/hypersphere-data/CUB_200_2011/CUB_200_2011"
class_num: 200
validation_ratio: 0.1
validation_seed: 42

# Model
image_size: 224
feature_dim: 512
backbone_name: "ViT-B-16"
pretrained: "laion2b_s34b_b88k"
adapter_hidden_dim: 1024
adapter_dropout: 0.15
transform_profile: "cub_fine_grained_two_view"

# Optimization
precision: "fp16"
batch_size: 96
eval_batch_size: 256
epochs: 120
learning_rate: 0.00025
weight_decay: 0.00001
lr_scheduler: "cosine"
min_learning_rate: 0.000003

# Compact / clustering
instance_temperature: 0.2
cluster_temperature: 0.35
lambda_instance: 1.0
lambda_cluster: 1.0
semantic_prototype_enabled: true
semantic_prompt_style: "auto"
semantic_prototype_aggregation: "mean"
lambda_semantic: 0.12
semantic_temperature: 0.2

sinkhorn_iters: 3
sinkhorn_epsilon: 0.05

# Subspace
lambda_subspace: 0.14
subspace_rank: 8
subspace_queue_size: 64
subspace_min_mass: 4.0
subspace_every_n_steps: 2
subspace_pca_q_offset: 2
subspace_topk_clusters: 24

# DPP
alpha_div_base: 0.45
dpp_warmup_epochs: 20
dpp_every_n_steps: 4
dpp_jitter: 0.00001

# Runtime / output
eval_interval: 1
model_path: "save/hypersphere_dpp/CUB_200_2011_CLIP_ViTB16_HypersphereDPP"
workers: 8
reload: false
seed: 42
best_checkpoint_patience: 20
